services:
  file-transfer:
    build: .
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/srv:rw
      - ./state:/state:rw
    command:
      - serve
      - --enable-admin
      - --bind
      - 0.0.0.0
      - --state
      - /state
      - --files
      - /srv
      - --origin
      - ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public HTTPS origin}
